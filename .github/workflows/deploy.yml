name: Deploy

# Veröffentlicht main auf Cloudflare Pages — gebaut und gebündelt mit dem
# wrangler aus package.json. Der Git-Build von Cloudflare Pages bündelt
# _worker.js mit einer eigenen, älteren wrangler-Version; deren Ersatz für
# node:timers verträgt Next.js 16 nicht (500 auf allen Seiten, 30.10.2026).
# Darum bricht `npm run pages:build` im Cloudflare-Git-Build bewusst ab
# (scripts/no-pages-git-build.mjs).
#
# Läuft bei jedem Push auf main und von Hand (Actions → Deploy → Run workflow).
# Hinweis: Pushes des Auto-Merge-Workflows (GITHUB_TOKEN) lösen keinen
# Push-Trigger aus — darum ruft auto-merge-to-main.yml diesen Workflow auf.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3e23f2f1cf587388e6a90604f1d5e334 # wie in wrangler.toml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Cloudflare-Token vorhanden?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub-Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions). Token bei Cloudflare mit dem Recht „Cloudflare Pages: Edit“ anlegen."
            exit 1
          fi
      - run: npm ci
      - run: npm run pages:build
      - name: Auf Cloudflare Pages veröffentlichen
        run: npx wrangler pages deploy .open-next/assets --project-name sechszirbenhuette --branch main --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --format=%s)"
      - name: Startseite prüfen
        run: |
          sleep 20
          for url in https://sechszirbenhuette.com/ https://sechszirbenhuette.com/gaeste; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url → $code"
            test "$code" = "200"
          done

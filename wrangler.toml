name = "sechszirbenhuette"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Projekt - Output von @cloudflare/next-on-pages
pages_build_output_dir = ".vercel/output/static"

# D1 Datenbank Binding
# Nach `wrangler d1 create sechszirbenhuette-db` die database_id einfügen
[[d1_databases]]
binding = "DB"
database_name = "sechszirbenhuette-db"
database_id = "d8834b59-2896-49c5-a619-ca0ad7cb10a2"

# KV Namespace für Sessions/Cache
[[kv_namespaces]]
binding = "KV"
id = "b84fa9271bb34a9497c6d16018439795"

# R2 Bucket für Bilder & Videos
# Nach `wrangler r2 bucket create sechszirbenhuette-media` einfügen
[[r2_buckets]]
binding = "R2"
bucket_name = "sechszirbenhuette-media"

# Umgebungsvariablen (Secrets über Dashboard oder wrangler secret put)
[vars]
ENVIRONMENT = "production"
PUBLIC_R2_URL = "https://media.sechszirbenhuette.com"
